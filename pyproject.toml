[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-loop-codex-client"
version = "0.1.0"
description = "Standalone Codex structured client for Neural Loop"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

